<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Aether Thread: heavy work runs on warm worker isolates while the Flutter UI thread keeps drawing frames on time.">
  <title>Aether Thread</title>
  <style>
    .bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#8a8984}
    .line{stroke:#d9d8d3}.accent{fill:#2a78d6}.accentS{stroke:#2a78d6}.soft{fill:#cde2fb}
    .frame{fill:#1baf7a}.code{fill:#f0efec}.codeInk{fill:#104281}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.muted{fill:#8f8e86}
      .line{stroke:#383835}.accent{fill:#3987e5}.accentS{stroke:#3987e5}.soft{fill:#184f95}
      .frame{fill:#199e70}.code{fill:#262624}.codeInk{fill:#9ec5f4}
    }
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="360" rx="20"/>

  <!-- Left: name, promise, one line of code -->
  <text class="ink" x="56" y="104" font-size="52" font-weight="700">Aether Thread</text>
  <text class="ink2" x="58" y="148" font-size="22">Heavy work off Flutter's UI thread, in one call.</text>
  <rect class="code" x="56" y="182" width="536" height="52" rx="10"/>
  <text class="codeInk mono" x="76" y="215" font-size="18">await AetherConcurrentRunner.computeAsync(task);</text>
  <text class="muted" x="58" y="282" font-size="16">Warm isolates · shared native memory · parallel map</text>
  <text class="muted" x="58" y="308" font-size="16">Frame-aligned results · typed failures · zero dependencies · 6 platforms</text>

  <!-- Right: two lanes over time -->
  <text class="ink2" x="660" y="70" font-size="14" font-weight="600">UI thread</text>
  <line class="line" x1="760" y1="64" x2="1144" y2="64" stroke-width="2"/>
  <!-- frames drawn on time: 16 evenly spaced ticks -->
  <g class="frame">
    <rect x="764" y="52" width="18" height="24" rx="4"/><rect x="788" y="52" width="18" height="24" rx="4"/>
    <rect x="812" y="52" width="18" height="24" rx="4"/><rect x="836" y="52" width="18" height="24" rx="4"/>
    <rect x="860" y="52" width="18" height="24" rx="4"/><rect x="884" y="52" width="18" height="24" rx="4"/>
    <rect x="908" y="52" width="18" height="24" rx="4"/><rect x="932" y="52" width="18" height="24" rx="4"/>
    <rect x="956" y="52" width="18" height="24" rx="4"/><rect x="980" y="52" width="18" height="24" rx="4"/>
    <rect x="1004" y="52" width="18" height="24" rx="4"/><rect x="1028" y="52" width="18" height="24" rx="4"/>
    <rect x="1052" y="52" width="18" height="24" rx="4"/><rect x="1076" y="52" width="18" height="24" rx="4"/>
    <rect x="1100" y="52" width="18" height="24" rx="4"/><rect x="1124" y="52" width="18" height="24" rx="4"/>
  </g>
  <text class="muted" x="1144" y="98" font-size="13" text-anchor="end">every frame on time</text>

  <text class="ink2" x="660" y="146" font-size="14" font-weight="600">Worker 1</text>
  <text class="ink2" x="660" y="196" font-size="14" font-weight="600">Worker 2</text>
  <text class="ink2" x="660" y="246" font-size="14" font-weight="600">Worker 3</text>
  <line class="line" x1="760" y1="140" x2="1144" y2="140" stroke-width="2"/>
  <line class="line" x1="760" y1="190" x2="1144" y2="190" stroke-width="2"/>
  <line class="line" x1="760" y1="240" x2="1144" y2="240" stroke-width="2"/>
  <g class="accent">
    <rect x="764" y="126" width="150" height="28" rx="6"/>
    <rect x="920" y="126" width="96" height="28" rx="6"/>
    <rect x="1022" y="126" width="122" height="28" rx="6"/>
    <rect x="764" y="176" width="210" height="28" rx="6"/>
    <rect x="980" y="176" width="164" height="28" rx="6"/>
    <rect x="764" y="226" width="80" height="28" rx="6"/>
    <rect x="850" y="226" width="180" height="28" rx="6"/>
    <rect x="1036" y="226" width="108" height="28" rx="6"/>
  </g>
  <text class="muted" x="1144" y="282" font-size="13" text-anchor="end">heavy tasks run in parallel, off the UI thread</text>
  <text class="muted" x="760" y="318" font-size="12">time →</text>
</svg>
